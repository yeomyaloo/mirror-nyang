plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mirrornyang.app'
    // 이 PC에 이미 설치된 SDK(android-30, build-tools 30.0.3)에 맞춘 값
    compileSdk 30

    defaultConfig {
        applicationId 'com.mirrornyang.app'
        minSdk 24
        targetSdk 30
        versionCode 2
        versionName '0.1.1'
    }

    // 저장소에 들어 있는 공개 디버그 키로 서명한다.
    // 누가 빌드해도(로컬/GitHub Actions) 서명이 같아서 새 버전을 덮어 설치할 수 있다.
    // 비밀 키가 아니므로 Play 스토어 배포용으로 쓰면 안 된다.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // 접속 주소 QR 코드 생성용
    implementation 'com.google.zxing:core:3.5.1'
}
