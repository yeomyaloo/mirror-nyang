<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 470" width="960" height="470" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <g id="phone">
      <rect width="160" height="290" rx="24" fill="#5B3A29"/>
      <rect x="8" y="12" width="144" height="266" rx="17" fill="#FFFFFF"/>
    </g>
    <g id="cat">
      <circle r="22" fill="#FF9F7A"/>
      <path d="M-15 -2 L-13 -18 L-4 -9 Z M15 -2 L13 -18 L4 -9 Z" fill="#FFF6EC"/>
      <ellipse cy="1" rx="15" ry="13" fill="#FFF6EC"/>
      <circle cx="-5" r="2.3" fill="#5B3A29"/><circle cx="5" r="2.3" fill="#5B3A29"/>
    </g>
    <g id="tap">
      <circle r="16" fill="#FF9F7A" fill-opacity="0.35"/>
      <circle r="26" fill="none" stroke="#FF9F7A" stroke-width="3" stroke-opacity="0.7"/>
    </g>
  </defs>
  <rect width="960" height="470" rx="24" fill="#FFF6EC"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#5B3A29">안드로이드에서 쓰는 법 · How to use on Android</text>

  <!-- 1. install -->
  <g transform="translate(40 70)">
    <use xlink:href="#phone"/>
    <rect x="8" y="12" width="144" height="266" rx="17" fill="#000" fill-opacity="0.35"/>
    <rect x="16" y="86" width="128" height="120" rx="12" fill="#FFFFFF"/>
    <use xlink:href="#cat" transform="translate(80 114) scale(0.6)"/>
    <text x="80" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#333">미러냥</text>
    <text x="80" y="165" text-anchor="middle" font-size="10" fill="#555">이 앱을 설치할까요?</text>
    <text x="50" y="192" text-anchor="middle" font-size="11" fill="#888">취소</text>
    <text x="112" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#1A73E8">설치</text>
    <use xlink:href="#tap" transform="translate(112 188)"/>
  </g>
  <circle cx="72" cy="388" r="15" fill="#FF9F7A"/><text x="72" y="394" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">1</text>
  <text x="96" y="394" font-size="15" font-weight="700" fill="#5B3A29">APK 받아서 설치</text>
  <text x="60" y="416" font-size="12" fill="#8A6A5A">Download &amp; install the APK</text>
  <text x="60" y="436" font-size="11.5" fill="#8A6A5A">"출처를 알 수 없는 앱" 허용</text>
  <text x="60" y="452" font-size="11" fill="#A08878">Allow unknown sources</text>

  <!-- 2. start -->
  <g transform="translate(270 70)">
    <use xlink:href="#phone"/>
    <use xlink:href="#cat" transform="translate(80 70)"/>
    <text x="80" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#5B3A29">미러냥</text>
    <text x="80" y="136" text-anchor="middle" font-size="9.5" fill="#5B3A29">쉬는 중이에요 😺</text>
    <rect x="22" y="170" width="116" height="34" rx="17" fill="#FF9F7A"/>
    <text x="80" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF">미러링 시작</text>
    <use xlink:href="#tap" transform="translate(80 187)"/>
  </g>
  <circle cx="302" cy="388" r="15" fill="#FF9F7A"/><text x="302" y="394" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">2</text>
  <text x="326" y="394" font-size="15" font-weight="700" fill="#5B3A29">"미러링 시작" 누르기</text>
  <text x="290" y="416" font-size="12" fill="#8A6A5A">Tap "Start mirroring"</text>

  <!-- 3. permission -->
  <g transform="translate(500 70)">
    <use xlink:href="#phone"/>
    <rect x="8" y="12" width="144" height="266" rx="17" fill="#000" fill-opacity="0.35"/>
    <rect x="16" y="80" width="128" height="134" rx="12" fill="#FFFFFF"/>
    <text x="80" y="104" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">미러냥으로 녹화 또는</text>
    <text x="80" y="119" text-anchor="middle" font-size="10.5" font-weight="700" fill="#333">전송을 시작할까요?</text>
    <rect x="26" y="132" width="108" height="20" rx="6" fill="#F1F1F1"/>
    <text x="80" y="146" text-anchor="middle" font-size="9.5" fill="#555">전체 화면 공유 ▾</text>
    <text x="50" y="194" text-anchor="middle" font-size="11" fill="#888">취소</text>
    <text x="110" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#1A73E8">지금 시작</text>
    <use xlink:href="#tap" transform="translate(110 190)"/>
  </g>
  <circle cx="532" cy="388" r="15" fill="#FF9F7A"/><text x="532" y="394" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">3</text>
  <text x="556" y="394" font-size="15" font-weight="700" fill="#5B3A29">"지금 시작" 누르기</text>
  <text x="520" y="416" font-size="12" fill="#8A6A5A">Tap "Start now"</text>
  <text x="520" y="436" font-size="11.5" fill="#8A6A5A">Android 14+: 전체 화면 공유</text>
  <text x="520" y="452" font-size="11" fill="#A08878">choose "Share entire screen"</text>

  <!-- 4. address -->
  <g transform="translate(730 70)">
    <use xlink:href="#phone"/>
    <use xlink:href="#cat" transform="translate(80 52) scale(0.7)"/>
    <text x="80" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#5B3A29">미러냥</text>
    <rect x="18" y="98" width="124" height="26" rx="6" fill="#FFF0E8" stroke="#D9534F" stroke-width="1.5"/>
    <text x="80" y="115" text-anchor="middle" font-size="9.8" font-weight="700" fill="#D9534F">http://192.168.0.12:8080</text>
    <g transform="translate(50 134)" fill="#5B3A29">
      <rect width="60" height="60" fill="#FFF" stroke="#5B3A29" stroke-width="2"/>
      <rect x="5" y="5" width="16" height="16"/><rect x="39" y="5" width="16" height="16"/><rect x="5" y="39" width="16" height="16"/>
      <rect x="27" y="10" width="6" height="6"/><rect x="27" y="27" width="10" height="6"/><rect x="40" y="30" width="6" height="12"/>
      <rect x="25" y="42" width="6" height="12"/><rect x="45" y="47" width="10" height="8"/><rect x="9" y="27" width="10" height="6"/>
    </g>
    <rect x="22" y="212" width="116" height="30" rx="15" fill="#FF9F7A"/>
    <text x="80" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF">미러링 멈추기</text>
  </g>
  <circle cx="762" cy="388" r="15" fill="#FF9F7A"/><text x="762" y="394" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">4</text>
  <text x="786" y="394" font-size="15" font-weight="700" fill="#5B3A29">주소 확인</text>
  <text x="750" y="416" font-size="12" fill="#8A6A5A">Note the address</text>
  <text x="750" y="436" font-size="11.5" fill="#8A6A5A">TV·PC 브라우저에 입력 →</text>
  <text x="750" y="452" font-size="11" fill="#A08878">type it into the TV/PC browser</text>

  <!-- arrows -->
  <g fill="#FF9F7A">
    <path d="M222 205 l14 10 l-14 10 z"/>
    <path d="M452 205 l14 10 l-14 10 z"/>
    <path d="M682 205 l14 10 l-14 10 z"/>
  </g>
</svg>
