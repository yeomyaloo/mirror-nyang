<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 560" width="960" height="560" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <g id="iphone">
      <rect width="120" height="236" rx="24" fill="#222"/>
      <rect x="6" y="6" width="108" height="224" rx="19" fill="#FFFFFF"/>
      <rect x="42" y="12" width="36" height="10" rx="5" fill="#222"/>
    </g>
    <g id="pc">
      <rect width="150" height="96" rx="6" fill="#5B3A29"/>
      <rect x="6" y="6" width="138" height="78" rx="3" fill="#EEF2F7"/>
      <rect x="62" y="96" width="26" height="14" fill="#5B3A29"/>
      <rect x="40" y="108" width="70" height="6" rx="3" fill="#5B3A29"/>
    </g>
    <g id="alt">
      <rect x="-14" y="-14" width="28" height="28" rx="7" fill="#1BB0A8"/>
      <path d="M-7 6 L0 -7 L7 6 Z" fill="#FFF"/>
    </g>
    <g id="tap">
      <circle r="13" fill="#FF9F7A" fill-opacity="0.35"/>
      <circle r="21" fill="none" stroke="#FF9F7A" stroke-width="3" stroke-opacity="0.7"/>
    </g>
  </defs>
  <rect width="960" height="560" rx="24" fill="#FFF6EC"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#5B3A29">아이폰 설치하기 (AltStore) · Installing on iPhone (AltStore)</text>
  <text x="480" y="64" text-anchor="middle" font-size="13" fill="#8A6A5A">무료 · 내 Apple ID 사용 · 컴퓨터(Windows/Mac)와 USB 케이블 필요 — Free, uses your Apple ID, needs a computer and a cable</text>

  <!-- 1. AltServer on PC -->
  <g transform="translate(20 100)">
    <use xlink:href="#pc"/>
    <rect x="6" y="70" width="138" height="14" fill="#D7DEE8"/>
    <use xlink:href="#alt" transform="translate(128 77) scale(0.42)"/>
    <rect x="44" y="18" width="88" height="44" rx="6" fill="#FFFFFF" stroke="#C9D2DE"/>
    <text x="88" y="36" text-anchor="middle" font-size="9" font-weight="700" fill="#333">AltServer</text>
    <text x="88" y="52" text-anchor="middle" font-size="8" fill="#666">altstore.io</text>
    <use xlink:href="#tap" transform="translate(128 77)"/>
  </g>
  <circle cx="34" cy="262" r="14" fill="#FF9F7A"/><text x="34" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF">1</text>
  <text x="54" y="268" font-size="14" font-weight="700" fill="#5B3A29">PC에 AltServer 설치</text>
  <text x="22" y="290" font-size="11.5" fill="#8A6A5A">Install AltServer on the PC</text>
  <text x="22" y="308" font-size="11" fill="#A08878">Windows: iTunes·iCloud도 설치</text>
  <text x="22" y="324" font-size="11" fill="#A08878">(Apple 홈페이지 버전)</text>

  <!-- 2. Install AltStore via cable -->
  <g transform="translate(205 100)">
    <use xlink:href="#pc" transform="translate(0 4) scale(0.75)"/>
    <text x="56" y="30" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Install AltStore ▸</text>
    <rect x="16" y="38" width="80" height="12" rx="3" fill="#FFFFFF"/>
    <text x="20" y="47" font-size="7.5" fill="#888">Apple ID</text>
    <rect x="16" y="53" width="80" height="12" rx="3" fill="#FFFFFF"/>
    <text x="20" y="62" font-size="7.5" fill="#888">••••••••</text>
    <path d="M56 92 C60 130 120 150 146 138" stroke="#5B3A29" stroke-width="3" fill="none"/>
    <g transform="translate(125 38) scale(0.42)"><use xlink:href="#iphone"/></g>
  </g>
  <circle cx="219" cy="262" r="14" fill="#FF9F7A"/><text x="219" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF">2</text>
  <text x="239" y="268" font-size="14" font-weight="700" fill="#5B3A29">케이블 연결 →</text>
  <text x="207" y="290" font-size="14" font-weight="700" fill="#5B3A29">Install AltStore</text>
  <text x="207" y="310" font-size="11.5" fill="#8A6A5A">Connect the cable,</text>
  <text x="207" y="326" font-size="11.5" fill="#8A6A5A">sign in with Apple ID</text>

  <!-- 3. Trust -->
  <g transform="translate(400 82)">
    <use xlink:href="#iphone"/>
    <text x="60" y="44" text-anchor="middle" font-size="8.5" fill="#888">설정 › 일반 ›</text>
    <text x="60" y="58" text-anchor="middle" font-size="9.5" font-weight="700" fill="#111">VPN 및 기기 관리</text>
    <rect x="12" y="70" width="96" height="26" rx="6" fill="#F2F2F2"/>
    <text x="20" y="87" font-size="8.5" fill="#111">개발자 앱</text>
    <text x="102" y="87" text-anchor="end" font-size="8" fill="#888">me@… ›</text>
    <rect x="12" y="110" width="96" height="44" rx="8" fill="#F2F2F2"/>
    <text x="60" y="128" text-anchor="middle" font-size="8.5" fill="#333">"me@…" 신뢰</text>
    <text x="60" y="146" text-anchor="middle" font-size="10" font-weight="700" fill="#1A73E8">신뢰</text>
    <use xlink:href="#tap" transform="translate(60 143)"/>
  </g>
  <circle cx="414" cy="344" r="14" fill="#FF9F7A"/><text x="414" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF">3</text>
  <text x="434" y="350" font-size="14" font-weight="700" fill="#5B3A29">설정에서 "신뢰"</text>
  <text x="402" y="370" font-size="11.5" fill="#8A6A5A">Settings › General ›</text>
  <text x="402" y="386" font-size="11.5" fill="#8A6A5A">VPN &amp; Device Management</text>
  <text x="402" y="402" font-size="11.5" fill="#8A6A5A">› Trust</text>

  <!-- 4. AltStore + IPA -->
  <g transform="translate(580 82)">
    <use xlink:href="#iphone"/>
    <text x="20" y="48" font-size="11" font-weight="700" fill="#111">My Apps</text>
    <text x="100" y="48" text-anchor="end" font-size="16" font-weight="700" fill="#1BB0A8">+</text>
    <use xlink:href="#tap" transform="translate(96 43)"/>
    <rect x="12" y="62" width="96" height="30" rx="8" fill="#F2F2F2"/>
    <use xlink:href="#alt" transform="translate(28 77) scale(0.6)"/>
    <text x="42" y="81" font-size="8.5" fill="#111">AltStore</text>
    <rect x="12" y="100" width="96" height="30" rx="8" fill="#FFF0E8" stroke="#FF9F7A"/>
    <circle cx="28" cy="115" r="9" fill="#FF9F7A"/>
    <text x="42" y="113" font-size="8.5" fill="#111">미러냥</text>
    <text x="42" y="124" font-size="7" fill="#888">7 DAYS</text>
    <rect x="12" y="150" width="96" height="40" rx="6" fill="#F7F7F7" stroke="#DDD"/>
    <text x="60" y="166" text-anchor="middle" font-size="7.5" fill="#666">파일 › 다운로드</text>
    <text x="60" y="180" text-anchor="middle" font-size="7.5" font-weight="700" fill="#333">mirror-nyang-v0.2.0.ipa</text>
  </g>
  <circle cx="594" cy="344" r="14" fill="#FF9F7A"/><text x="594" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF">4</text>
  <text x="614" y="350" font-size="14" font-weight="700" fill="#5B3A29">AltStore에서 + → IPA</text>
  <text x="582" y="370" font-size="11.5" fill="#8A6A5A">Download the IPA in Safari,</text>
  <text x="582" y="386" font-size="11.5" fill="#8A6A5A">AltStore › My Apps › +</text>

  <!-- 5. auto refresh -->
  <g transform="translate(770 110)">
    <use xlink:href="#pc" transform="scale(0.6)"/>
    <g transform="translate(110 -10) scale(0.42)"><use xlink:href="#iphone"/></g>
    <path d="M50 92 A60 60 0 0 0 128 96" stroke="#FF9F7A" stroke-width="4" fill="none"/>
    <path d="M128 96 l-2 -12 l10 6 z" fill="#FF9F7A"/>
    <path d="M128 -16 A60 60 0 0 0 50 -10" stroke="#FF9F7A" stroke-width="4" fill="none" transform="translate(0 20)"/>
    <text x="90" y="136" text-anchor="middle" font-size="22">🔄</text>
  </g>
  <circle cx="784" cy="262" r="14" fill="#FF9F7A"/><text x="784" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF">5</text>
  <text x="804" y="268" font-size="14" font-weight="700" fill="#5B3A29">자동 갱신</text>
  <text x="772" y="290" font-size="11.5" fill="#8A6A5A">AltServer 켜두고 같은 Wi-Fi면</text>
  <text x="772" y="306" font-size="11.5" fill="#8A6A5A">7일 전에 알아서 갱신</text>
  <text x="772" y="324" font-size="11" fill="#A08878">Keep AltServer running on the</text>
  <text x="772" y="338" font-size="11" fill="#A08878">same Wi-Fi: refreshes itself</text>

  <!-- notes -->
  <g transform="translate(30 430)">
    <rect width="900" height="108" rx="16" fill="#FFFFFF" stroke="#FFD2C0" stroke-width="2"/>
    <text x="24" y="32" font-size="15" font-weight="700" fill="#5B3A29">꼭 알아두세요 · Good to know</text>
    <text x="24" y="58" font-size="12.5" fill="#5B3A29">⏰ 무료 Apple ID 앱은 7일 뒤 안 열려요 → AltStore "Refresh All"이면 다시 OK (데이터 유지)</text>
    <text x="24" y="78" font-size="12.5" fill="#5B3A29">📱 무료 Apple ID는 이렇게 설치한 앱 3개까지 (AltStore 포함)  ·  🛠 iOS 16+: 설정 › 개인정보 보호 및 보안 › 개발자 모드 켜기</text>
    <text x="24" y="98" font-size="11.5" fill="#8A6A5A">Free Apple ID apps expire after 7 days (refresh keeps data) · max 3 sideloaded apps · iOS 16+: turn on Developer Mode</text>
  </g>

  <g fill="#FF9F7A">
    <path d="M178 150 l12 9 l-12 9 z"/>
    <path d="M384 190 l12 9 l-12 9 z"/>
    <path d="M548 190 l12 9 l-12 9 z"/>
    <path d="M728 190 l12 9 l-12 9 z"/>
  </g>
</svg>
