<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 470" width="960" height="470" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <g id="iphone">
      <rect width="150" height="296" rx="30" fill="#222"/>
      <rect x="7" y="7" width="136" height="282" rx="24" fill="#FFF6EC"/>
      <rect x="52" y="14" width="46" height="13" rx="6.5" fill="#222"/>
    </g>
    <g id="cat">
      <circle r="22" fill="#FF9F7A"/>
      <path d="M-15 -2 L-13 -18 L-4 -9 Z M15 -2 L13 -18 L4 -9 Z" fill="#FFF6EC"/>
      <ellipse cy="1" rx="15" ry="13" fill="#FFF6EC"/>
      <circle cx="-5" r="2.3" fill="#5B3A29"/><circle cx="5" r="2.3" fill="#5B3A29"/>
    </g>
    <g id="tap">
      <circle r="16" fill="#FF9F7A" fill-opacity="0.35"/>
      <circle r="26" fill="none" stroke="#FF9F7A" stroke-width="3" stroke-opacity="0.7"/>
    </g>
  </defs>
  <rect width="960" height="470" rx="24" fill="#FFF6EC"/>
  <rect x="0" y="0" width="960" height="470" rx="24" fill="none"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#5B3A29">아이폰에서 쓰는 법 · How to use on iPhone</text>

  <!-- 1. local network -->
  <g transform="translate(45 70)">
    <use xlink:href="#iphone"/>
    <use xlink:href="#cat" transform="translate(75 62) scale(0.8)"/>
    <text x="75" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#5B3A29">미러냥</text>
    <rect x="7" y="7" width="136" height="282" rx="24" fill="#000" fill-opacity="0.3"/>
    <rect x="17" y="112" width="116" height="112" rx="14" fill="#F2F2F2"/>
    <text x="75" y="134" text-anchor="middle" font-size="9.5" font-weight="700" fill="#111">"미러냥"이 로컬 네트워크의</text>
    <text x="75" y="148" text-anchor="middle" font-size="9.5" font-weight="700" fill="#111">기기를 찾고 연결하도록</text>
    <text x="75" y="162" text-anchor="middle" font-size="9.5" font-weight="700" fill="#111">허용하겠습니까?</text>
    <line x1="17" y1="190" x2="133" y2="190" stroke="#CCC"/>
    <line x1="75" y1="190" x2="75" y2="224" stroke="#CCC"/>
    <text x="46" y="211" text-anchor="middle" font-size="11" fill="#1A73E8">허용 안 함</text>
    <text x="104" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#1A73E8">허용</text>
    <use xlink:href="#tap" transform="translate(104 207)"/>
  </g>
  <circle cx="72" cy="398" r="15" fill="#FF9F7A"/><text x="72" y="404" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">1</text>
  <text x="96" y="404" font-size="15" font-weight="700" fill="#5B3A29">앱 열고 "허용"</text>
  <text x="60" y="426" font-size="12" fill="#8A6A5A">Open the app, allow</text>
  <text x="60" y="442" font-size="12" fill="#8A6A5A">Local Network access</text>

  <!-- 2. broadcast -->
  <g transform="translate(275 70)">
    <use xlink:href="#iphone"/>
    <rect x="7" y="7" width="136" height="282" rx="24" fill="#1E1E1E" fill-opacity="0.92"/>
    <text x="75" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF">화면 브로드캐스트</text>
    <rect x="22" y="88" width="106" height="30" rx="8" fill="#3A3A3A"/>
    <circle cx="38" cy="103" r="9" fill="#FF9F7A"/>
    <text x="54" y="107" font-size="11" fill="#FFF">미러냥</text>
    <text x="118" y="107" text-anchor="end" font-size="12" fill="#FF9F7A">✓</text>
    <rect x="22" y="124" width="106" height="30" rx="8" fill="#2A2A2A"/>
    <text x="54" y="143" font-size="11" fill="#888">사진</text>
    <circle cx="75" cy="200" r="22" fill="#FFF"/>
    <circle cx="75" cy="200" r="16" fill="#FF3B30"/>
    <text x="75" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">방송 시작</text>
    <use xlink:href="#tap" transform="translate(75 236)"/>
  </g>
  <circle cx="302" cy="398" r="15" fill="#FF9F7A"/><text x="302" y="404" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">2</text>
  <text x="326" y="404" font-size="15" font-weight="700" fill="#5B3A29">"방송 시작"</text>
  <text x="290" y="426" font-size="12" fill="#8A6A5A">Tap the round button →</text>
  <text x="290" y="442" font-size="12" fill="#8A6A5A">"Start Broadcast"</text>
  <text x="290" y="460" font-size="10.5" fill="#A08878">제어 센터 ⏺ 길게 눌러도 돼요 · or long-press ⏺ in Control Center</text>

  <!-- 3. address to TV -->
  <g transform="translate(505 70)">
    <use xlink:href="#iphone"/>
    <rect x="7" y="7" width="40" height="18" rx="9" fill="#FF3B30"/>
    <use xlink:href="#cat" transform="translate(75 70) scale(0.8)"/>
    <text x="75" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#5B3A29">미러냥</text>
    <rect x="15" y="122" width="120" height="44" rx="10" fill="#FFFFFF"/>
    <text x="75" y="138" text-anchor="middle" font-size="8.5" fill="#5B3A29">TV/PC 브라우저에 입력</text>
    <text x="75" y="156" text-anchor="middle" font-size="10" font-weight="700" fill="#D9534F">http://192.168.0.12:8080</text>
  </g>
  <g transform="translate(640 160)">
    <path d="M0 40 H40" stroke="#5B3A29" stroke-width="3" stroke-dasharray="6 6"/>
    <rect x="44" y="0" width="56" height="34" rx="3" fill="#2B2B2B"/>
    <rect x="48" y="4" width="48" height="26" fill="#000"/>
    <rect x="66" y="7" width="12" height="20" rx="2" fill="#FFF"/>
    <rect x="66" y="34" width="12" height="5" fill="#2B2B2B"/>
  </g>
  <circle cx="532" cy="398" r="15" fill="#FF9F7A"/><text x="532" y="404" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">3</text>
  <text x="556" y="404" font-size="15" font-weight="700" fill="#5B3A29">TV·PC에 주소 입력</text>
  <text x="520" y="426" font-size="12" fill="#8A6A5A">Type the address into</text>
  <text x="520" y="442" font-size="12" fill="#8A6A5A">the TV/PC browser</text>

  <!-- 4. stop -->
  <g transform="translate(755 70)">
    <use xlink:href="#iphone"/>
    <rect x="7" y="7" width="40" height="18" rx="9" fill="#FF3B30"/>
    <use xlink:href="#tap" transform="translate(27 16)"/>
    <rect x="7" y="7" width="136" height="282" rx="24" fill="#000" fill-opacity="0.25"/>
    <rect x="17" y="110" width="116" height="96" rx="14" fill="#F2F2F2"/>
    <text x="75" y="134" text-anchor="middle" font-size="10" font-weight="700" fill="#111">화면 브로드캐스트를</text>
    <text x="75" y="149" text-anchor="middle" font-size="10" font-weight="700" fill="#111">중단하겠습니까?</text>
    <line x1="17" y1="170" x2="133" y2="170" stroke="#CCC"/>
    <line x1="75" y1="170" x2="75" y2="206" stroke="#CCC"/>
    <text x="46" y="192" text-anchor="middle" font-size="11" fill="#1A73E8">취소</text>
    <text x="104" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#FF3B30">중단</text>
  </g>
  <circle cx="782" cy="398" r="15" fill="#FF9F7A"/><text x="782" y="404" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">4</text>
  <text x="806" y="404" font-size="15" font-weight="700" fill="#5B3A29">끝낼 때</text>
  <text x="770" y="426" font-size="12" fill="#8A6A5A">빨간 표시 → "중단"</text>
  <text x="770" y="442" font-size="12" fill="#8A6A5A">Tap the red pill → Stop</text>

  <g fill="#FF9F7A">
    <path d="M216 205 l14 10 l-14 10 z"/>
    <path d="M446 205 l14 10 l-14 10 z"/>
  </g>
</svg>
