name: Build APK

on:
  push:
    tags: ['v*']        # v0.1.0 같은 태그를 push하면 Release에 APK를 올린다
  workflow_dispatch:     # Actions 탭에서 수동 실행하면 빌드만 하고 아티팩트로 남긴다

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 30
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3" > /dev/null

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          NAME="mirror-nyang-${GITHUB_REF_NAME}.apk"
          [ "$GITHUB_REF_TYPE" = "tag" ] || NAME="mirror-nyang-dev.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          body: |
            🐱 미러냥 ${{ github.ref_name }}

            **설치:** 아래 `${{ env.APK_NAME }}`을 폰에서 받아 설치하세요. "출처를 알 수 없는 앱" 설치를 허용해야 합니다.
            **사용:** 앱에서 "미러링 시작" → 폰에 뜬 주소를 같은 Wi-Fi의 TV(삼성 "인터넷" 앱)나 PC 브라우저에 입력.

            자세한 사용법은 README를 참고하세요.
