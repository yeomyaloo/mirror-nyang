name: Build APK & IPA

on:
  push:
    branches: [main]     # main에 push하면 빌드만 해서 아티팩트로 남긴다 (컴파일 확인용)
    tags: ['v*']         # v0.2.0 같은 태그를 push하면 Release에 APK와 IPA를 올린다
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 30
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3" > /dev/null

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          VER="${GITHUB_REF_NAME}"; [ "$GITHUB_REF_TYPE" = "tag" ] || VER="dev"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/mirror-nyang-${VER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild -project MirrorNyang.xcodeproj -scheme MirrorNyang -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)"

      - name: Package IPA (unsigned, for Sideloadly/AltStore)
        run: |
          VER="${GITHUB_REF_NAME}"; [ "$GITHUB_REF_TYPE" = "tag" ] || VER="dev"
          mkdir -p Payload dist
          cp -R ios/build/Build/Products/Release-iphoneos/MirrorNyang.app Payload/
          ls Payload/MirrorNyang.app/PlugIns
          zip -qry "dist/mirror-nyang-${VER}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            🐱 MirrorNyang (미러냥) ${{ github.ref_name }}

            **Android:** download the `.apk` on your phone and install it (allow unknown sources).
            **iPhone:** download the `.ipa` and install it with AltStore or Sideloadly using your Apple ID, then trust the developer in Settings. Free Apple IDs need a refresh every 7 days. See the README for step-by-step instructions.

            **안드로이드:** 폰에서 `.apk`를 받아 설치하세요 ("출처를 알 수 없는 앱" 허용 필요).
            **아이폰:** `.ipa`를 받아 AltStore나 Sideloadly로 내 Apple ID를 넣고 설치한 뒤, 설정에서 개발자를 신뢰하세요. 무료 Apple ID는 7일마다 갱신해야 합니다. 자세한 방법은 README를 보세요.
